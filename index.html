<html>

<head>
  <title>Hueforge at home</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.0/lib/p5.js"></script>
  <script src="https://scrtwpns.com/mixbox.js"></script>
  <script type="module" src="src/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @layer components {
      .background {
        @apply bg-fixed bg-linear-to-b from-black to-slate-900 p-8 flex gap-8 font-semibold;
      }

      .content {
        @apply p-4 bg-slate-800 rounded-lg border ring border-slate-700 border-t-slate-600;
      }

      .btn-primary {
        @apply bg-linear-to-b from-slate-700 to-slate-600 border border-slate-600 border-t-slate-500 border-l-slate-500 shadow-lg/20 hover:cursor-pointer duration-200 hover:hue-rotate-0 hover:border-slate-300 text-white rounded-lg;
      }

      .gradient-bg {
        @apply bg-linear-to-l/longer from-indigo-400 to-teal-400
      }

      .input-group {
        @apply text-gray-100 m-2;
      }

      .color-input {
        @apply h-8 flex;
      }
    }
  </style>
</head>

<body class="background">
  <div class="content overflow-auto w-1/4 p-2 flex flex-col content-center">
    <div class="input-group flex">
      <label class="btn-primary w-full py-2 text-md text-center">Choose Image
        <input id="fileInput" type="file" accept="image/*" class="hidden"></input>
      </label>
    </div>
    <div class="input-group">
      <label for="numLayers">Number of Layers: <span id="layerCount">16</span></label></br>
      <input id="numLayers" class="w-full" type="range" data-state="layers" data-output="layerCount" min="2" max="100" value="16" step="1">
    </div>
    <div class="input-group">
      <h3>Gradient Preview</h3>
      <canvas class="w-full mt-2 self-center border border-slate-700 h-8 rounded-lg" id="gradientPreview"></canvas>
    </div>
    <div class="input-group">
      <ul onchange="setup()" id="colorList" class="flex flex-col gap-2 text-gray-900">
        <li class="flex text-gray-100">
          <label class="w-1/3">Color</label>
          <label class="w-1/3">Layer</label>
          <label class="w-1/3">Opacity</label>
          <label class="w-8"></label>
        </li>
      </ul>
      <button id="addColorButton" onclick="addColorToList()" class="w-full gradient-bg rounded-xl p-0.5 h-9 text-lg mt-2">
        <div class="btn-primary border-0 h-full">
          <div class="gradient-bg saturate-150 bg-clip-text text-transparent">
            Add color layer
          </div>
        </div>
      </button>
      <button id="download-bw" class="w-full btn-primary p-2 mt-2">
        Export black & white gradients
      </button>
    </div>
    <div class="input-group">
      <h3>Histogram</h3>
      <canvas class="w-full mt-2 self-center border border-slate-700 h-64" id="imageHistogram"></canvas>
      <div class="flex my-2 peer items-center">
        <input id="segmentFlag" type="checkbox" class="w-6 h-6 rounded-md">
        <label for="segmentFlag" class="select-none ms-2 text-heading">Enable two gradients</label>
      </div>
      <div class="peer-has-checked:block hidden">
        <label for="hueSegment">Hue segment <span id="segmentAngle">180</span></label></br>
        <input id="hueSegment" class="w-full" type="range" data-state="hueSegment" data-output="segmentAngle" min="0" max="360" value="180" step="1">
        <label for="hueOffset">Hue offset <span id="offsetAngle">40</span></label></br>
        <input id="hueOffset" class="w-full" type="range" data-state="hueOffset" data-output="offsetAngle" min="0" max="360" value="40" step="1">
        <label for="blendFactor">Blend Factor <span id="factor">20</span></label></br>
        <input id="blendFactor" class="w-full" type="range" data-state="blendFactor" data-output="factor" min="1" max="200" value="20" step="1">
      </div>
    </div>
  </div>
  <div class="content w-3/4">
    <canvas id="existing-canvas"></canvas>
  </div>
</body>

</html>
