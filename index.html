<html class="h-full">

<head>
  <title>Hueforge at home</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/p5.js"></script>
  <script src="https://scrtwpns.com/mixbox.js"></script>
  <script type="module" src="src/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @layer components {
      .background {
        @apply bg-linear-to-b from-black to-slate-900 m-8 flex gap-8 font-semibold;
      }

      .content {
        @apply p-4 bg-slate-800 rounded-lg border ring border-slate-700 border-t-slate-600;
      }

      .gradient-btn {
        @apply bg-linear-to-b from-slate-700 to-slate-600 border border-slate-600 border-t-slate-500 border-l-slate-500 shadow-lg/20 hover:cursor-pointer duration-200 hover:border-slate-300 text-white rounded-lg;
      }

      .input-group {
        @apply text-gray-100 m-4;
      }

      .color-input {
        @apply h-8 grid grid-cols-3;
      }
    }
  </style>
</head>

<body class="background">
  <div class="content w-1/5 p-4 flex flex-col content-center">
    <div class="input-group flex">
      <label class="gradient-btn w-full py-3 text-lg text-center">Choose Image
        <input id="fileInput" type="file" accept="image/*" class="hidden"></input>
      </label>
    </div>
    <div class="input-group">
      <h3>Gradient Preview</h3>
      <canvas class="w-full mt-2 self-center border border-slate-700 h-8 rounded-lg" id="gradient-preview"></canvas>
    </div>
    <div class="input-group">
      <label for="numLayers">Number of Layers: <span id="layerCount">10</span></label></br>
      <input class="w-full" type="range" id="numLayers" min="2" max="50" value="10" step="1">
    </div>
    <div class="input-group">
      <ul onchange="window.setup()" id="colorList" class="flex flex-col gap-2 text-gray-900">
        <li class="grid grid-cols-3 justify-center text-gray-100">
          <label for="default-range">Color</label>
          <label for="default-range">Layer</label>
          <label for="default-range">Opacity 0-1</label>
        </li>
        <li class="color-input">
          <div class="relative">
            <input type="color" value="#000000" class="w-full h-full absolute z-10 opacity-0 cursor-pointer"
              onchange="this.nextElementSibling.style.backgroundColor = this.value" />
            <div class="rounded-l-lg absolute h-8 w-full bg-black border border-slate-700"></div>
          </div>
          <input class="layer px-2 bg-gray-50 border border-gray-300" type="number" value="1" />
          <input class="opacity px-2 bg-gray-50 rounded-r-lg border border-gray-300" value="1" />
        </li>
        <li class="color-input">
          <div class="relative">
            <input type="color" value="#000000" class="w-full h-full absolute z-10 opacity-0 cursor-pointer"
              onchange="this.nextElementSibling.style.backgroundColor = this.value" />
            <div class="rounded-l-lg absolute h-full w-full bg-black border border-slate-700"></div>
          </div>
          <input class="layer px-2 bg-gray-50 border border-gray-300" type="number" value="2" />
          <input class="opacity px-2 bg-gray-50 rounded-r-lg border border-gray-300" value="0.35" />
        </li>
        <li class="color-input">
          <div class="relative">
            <input type="color" value="#000000" class="w-full h-full absolute z-10 opacity-0 cursor-pointer"
              onchange="this.nextElementSibling.style.backgroundColor = this.value" />
            <div class="rounded-l-lg absolute h-full w-full bg-black border border-slate-700"></div>
          </div>
          <input class="layer px-2 bg-gray-50 border border-gray-300" type="number" value="4" />
          <input class="opacity px-2 bg-gray-50 rounded-r-lg border border-gray-300" value="0.35" />
        </li>
        <li class="color-input">
          <div class="relative">
            <input type="color" value="#000000" class="w-full h-full absolute z-10 opacity-0 cursor-pointer"
              onchange="this.nextElementSibling.style.backgroundColor = this.value" />
            <div class="rounded-l-lg absolute h-full w-full bg-black border border-slate-700"></div>
          </div>
          <input class="layer px-2 bg-gray-50 border border-gray-300" type="number" value="11" />
          <input class="opacity px-2 bg-gray-50 rounded-r-lg border border-gray-300" value="0.35" />
        </li>
      </ul>
    </div>
  </div>
  <div class="content w-4/5">
    <canvas id="existing-canvas"></canvas>
  </div>
</body>

</html>
